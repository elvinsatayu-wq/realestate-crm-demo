<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer · Real Estate CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/js/tailwind.config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/th.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body class="font-sans text-slate-800 antialiased">
  <aside id="sidebar"></aside>
  <div class="min-h-screen lg:pl-64">
    <header id="topbar"></header>

    <main class="space-y-6 p-4 md:p-6 lg:p-8">
      <section class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <p class="eyebrow">Transfer</p>
          <p class="mt-1 text-sm text-slate-500">ข้อมูลช่วง: <span class="font-medium text-slate-700" data-range-label></span></p>
        </div>
        <button type="button" class="btn btn-primary" data-new data-perm="transfers:write"><span data-icon="plus" class="w-4 h-4"></span> บันทึกการโอน</button>
      </section>

      <section id="kpis" class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-5"></section>

      <section class="grid gap-4 lg:grid-cols-3">
        <div class="card p-5">
          <h3 class="card-title">ธนาคารที่โอน / อนุมัติสินเชื่อ</h3>
          <p class="card-sub mb-4">จำนวนรายการโอนแยกตามธนาคาร</p>
          <div class="relative h-64"><canvas id="chart-bank"></canvas></div>
        </div>
        <div class="card p-5">
          <h3 class="card-title">ยอดโอนสุทธิแยกตามโครงการ</h3>
          <p class="card-sub mb-4">มูลค่าที่ปิดการขายสำเร็จ</p>
          <div class="relative h-64"><canvas id="chart-project"></canvas></div>
        </div>
        <div class="card flex flex-col p-5">
          <div class="mb-3 flex items-center justify-between">
            <div>
              <h3 class="card-title">รายการจองที่รอโอน</h3>
              <p class="card-sub">ทุกช่วงเวลา · เรียงจากจองนานที่สุด</p>
            </div>
            <span id="pending-count"></span>
          </div>
          <ul id="pending-list" class="-mx-2 max-h-64 flex-1 space-y-1 overflow-y-auto scroll-thin"></ul>
        </div>
      </section>

      <section class="card overflow-hidden">
        <div class="flex flex-wrap items-center gap-3 border-b border-slate-100 p-4">
          <h3 class="card-title mr-auto">รายการโอนกรรมสิทธิ์</h3>
          <label class="relative w-full sm:w-64">
            <span data-icon="search" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></span>
            <input type="search" id="filter-q" class="field-input !pl-9" placeholder="ค้นหาชื่อ, โครงการ, แปลง, ธนาคาร">
          </label>
        </div>
        <div id="transfer-table"></div>
      </section>
    </main>
  </div>

  <!-- Transfer form -->
  <div class="modal" id="transfer-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <form id="transfer-form" class="modal-panel max-w-2xl">
      <header class="modal-header">
        <h3 data-modal-title>บันทึกการโอนกรรมสิทธิ์</h3>
        <button type="button" class="icon-btn" data-close aria-label="ปิด"><span data-icon="x" class="w-5 h-5"></span></button>
      </header>
      <div class="modal-body space-y-5">
        <label class="field">
          <span class="field-label">เลือกลูกค้าจากรายการจอง (Book) <b class="req">*</b></span>
          <select name="bookingId" id="booking-select" class="field-input" required></select>
        </label>

        <div id="booking-info" class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm"></div>

        <div class="grid gap-4 sm:grid-cols-2">
          <label class="field">
            <span class="field-label">วันที่โอนกรรมสิทธิ์ <b class="req">*</b></span>
            <input type="date" name="date" class="field-input" required>
          </label>
          <label class="field">
            <span class="field-label">ยอดโอนสุทธิ (บาท) <b class="req">*</b></span>
            <input type="number" name="netAmount" class="field-input" min="0" step="1000" placeholder="เช่น 12400000" required>
          </label>
          <label class="field">
            <span class="field-label">ธนาคารที่โอน / อนุมัติสินเชื่อ</span>
            <input type="text" name="bank" class="field-input" list="bank-list" placeholder="เลือกหรือพิมพ์ชื่อธนาคาร">
            <datalist id="bank-list" data-options="banks"></datalist>
          </label>
          <label class="field">
            <span class="field-label">เงินเหลือให้ลูกค้า / Cash Back (บาท)</span>
            <input type="number" name="cashBack" class="field-input" min="0" step="1000" placeholder="0">
          </label>
          <label class="field sm:col-span-2">
            <span class="field-label">หมายเหตุ</span>
            <textarea name="note" class="field-input" rows="2" placeholder="รายละเอียดเพิ่มเติม เช่น เลขที่โฉนด ค่าธรรมเนียมการโอน"></textarea>
          </label>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึกการโอน</button>
      </footer>
    </form>
  </div>

  <script type="module" src="/js/pages/transfers.js"></script>
</body>
</html>
