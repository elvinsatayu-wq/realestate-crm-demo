<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Management · Real Estate CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/js/tailwind.config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/th.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body class="font-sans text-slate-800 antialiased">
  <aside id="sidebar"></aside>
  <div class="min-h-screen lg:pl-64">
    <header id="topbar"></header>

    <main class="space-y-6 p-4 md:p-6 lg:p-8">
      <section class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <p class="eyebrow">Lead Management</p>
          <p class="mt-1 text-sm text-slate-500">ข้อมูลช่วง: <span class="font-medium text-slate-700" data-range-label></span></p>
          <p class="mt-1 flex items-center gap-1 text-xs text-brand-600" data-scope-note hidden></p>
        </div>
        <button type="button" class="btn btn-primary" data-new data-perm="leads:write"><span data-icon="plus" class="w-4 h-4"></span> เพิ่ม Lead</button>
      </section>

      <section id="kpis" class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-5"></section>

      <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
        <div class="card p-5">
          <h3 class="card-title">ช่องทางการลงทะเบียน</h3>
          <p class="card-sub mb-4">สัดส่วน Lead แยกตามช่องทาง</p>
          <div class="relative h-64"><canvas id="chart-channel"></canvas></div>
        </div>
        <div class="card p-5">
          <h3 class="card-title">ช่วงงบประมาณ</h3>
          <p class="card-sub mb-4">จำนวน Lead ในแต่ละช่วงงบ</p>
          <div class="relative h-64"><canvas id="chart-budget"></canvas></div>
        </div>
        <div class="card p-5 md:col-span-2 xl:col-span-1">
          <h3 class="card-title">สถานะการติดตาม</h3>
          <p class="card-sub mb-4">ผลการติดต่อ Lead ล่าสุด</p>
          <div class="relative h-64"><canvas id="chart-status"></canvas></div>
        </div>
      </section>

      <section class="card overflow-hidden">
        <div class="flex flex-wrap items-center gap-3 border-b border-slate-100 p-4">
          <h3 class="card-title mr-auto">รายการ Lead</h3>
          <label class="relative w-full sm:w-64">
            <span data-icon="search" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></span>
            <input type="search" id="filter-q" class="field-input !pl-9" placeholder="ค้นหาชื่อ, เบอร์โทร, Line ID">
          </label>
          <select id="filter-status" class="field-input sm:!w-48" data-options="leadStatuses" data-placeholder="ทุกสถานะ" aria-label="กรองสถานะ"></select>
          <select id="filter-channel" class="field-input sm:!w-40" data-options="leadChannels" data-placeholder="ทุกช่องทาง" aria-label="กรองช่องทาง"></select>
          <select id="filter-assignee" class="field-input sm:!w-48" data-perm="records:all" data-assignees data-unassigned data-placeholder="ผู้รับผิดชอบทั้งหมด" aria-label="กรองผู้รับผิดชอบ"></select>
        </div>
        <div id="lead-table"></div>
      </section>
    </main>
  </div>

  <!-- Lead form -->
  <div class="modal" id="lead-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <form id="lead-form" class="modal-panel max-w-2xl">
      <header class="modal-header">
        <h3 data-modal-title>เพิ่ม Lead ใหม่</h3>
        <button type="button" class="icon-btn" data-close aria-label="ปิด"><span data-icon="x" class="w-5 h-5"></span></button>
      </header>
      <div class="modal-body grid gap-4 sm:grid-cols-2">
        <label class="field">
          <span class="field-label">วันที่ลงทะเบียน <b class="req">*</b></span>
          <input type="date" name="date" class="field-input" required>
        </label>
        <label class="field">
          <span class="field-label">ช่องทางที่ลงทะเบียน <b class="req">*</b></span>
          <select name="channel" class="field-input" data-options="leadChannels" data-placeholder="เลือกช่องทาง" required></select>
        </label>
        <label class="field sm:col-span-2">
          <span class="field-label">ชื่อลูกค้า <b class="req">*</b></span>
          <input type="text" name="name" class="field-input" placeholder="ชื่อ - นามสกุล" required maxlength="120">
        </label>
        <label class="field">
          <span class="field-label">หมายเลขติดต่อ</span>
          <input type="tel" name="phone" class="field-input" placeholder="08x-xxx-xxxx" maxlength="20">
        </label>
        <label class="field">
          <span class="field-label">Line ID</span>
          <input type="text" name="lineId" class="field-input" placeholder="Line ID" maxlength="60">
        </label>
        <label class="field">
          <span class="field-label">งบประมาณ</span>
          <select name="budget" class="field-input" data-options="budgets" data-placeholder="เลือกช่วงงบประมาณ"></select>
        </label>
        <label class="field">
          <span class="field-label">สถานะ <b class="req">*</b></span>
          <select name="status" class="field-input" data-options="leadStatuses" data-placeholder="เลือกสถานะ" required></select>
        </label>
        <label class="field sm:col-span-2" data-perm="records:assign">
          <span class="field-label">ฝ่ายขายผู้รับผิดชอบ (Assigned)</span>
          <select name="assignedTo" class="field-input" data-assignees data-placeholder="— ยังไม่มอบหมาย —"></select>
        </label>
        <label class="field sm:col-span-2">
          <span class="field-label">รายละเอียดการติดต่อ</span>
          <textarea name="detail" class="field-input" rows="4" placeholder="บันทึกสิ่งที่ลูกค้าสอบถาม ความต้องการ หรือนัดหมายครั้งถัดไป"></textarea>
        </label>
        <div class="field sm:col-span-2">
          <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
            <span class="field-label !mb-0">บันทึกการติดตาม</span>
            <button type="button" class="btn btn-soft btn-sm" data-add-followup><span data-icon="plus" class="w-4 h-4"></span> เพิ่มบันทึกการติดตาม</button>
          </div>
          <div class="space-y-3" data-followups></div>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
      </footer>
    </form>
  </div>

  <script type="module" src="/js/pages/leads.js"></script>
</body>
</html>
